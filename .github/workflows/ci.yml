name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  check:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run quality checks
        run: make check


  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build containers
        run: make build

      - name: Start services
        run: make up

      - name: Run tests
        run: make test

      - name: Cleanup test environment
        if: always()
        run: make down


  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - check
      - test

    permissions:
      contents: read
      packages: write

    env:
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build image
        run: make build

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: make push

      - name: Cleanup docker artifacts
        if: always()
        run: docker image prune -af

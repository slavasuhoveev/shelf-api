x-postgres-cred: &postgres-cred
  POSTGRES_USER: ${PROJECT_NAME}_user
  POSTGRES_PASSWORD: ${PROJECT_NAME}
  POSTGRES_DB: ${PROJECT_NAME}_db

x-global_envs: &global_envs
  AUTH_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
  JWT_ISSUER: ${PROJECT_NAME}-auth
  JWT_AUDIENCE: ${PROJECT_NAME}-api
  JWKS_CACHE_TTL_SECONDS: 300

services:
  postgresql:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_db
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    environment:
      <<: *postgres-cred
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROJECT_NAME}_user -d ${PROJECT_NAME}_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  shelf_api:
    build:
      context: .
      target: development
    image: ${PROJECT_NAME}:${TAG}
    container_name: ${PROJECT_NAME}_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      <<:
        - *global_envs
        - *postgres-cred
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:delegated
      - ./alembic:/app/alembic:delegated
      - ./alembic.ini:/app/alembic.ini:delegated
    command: uvicorn shelf.app.main:app --host 0.0.0.0 --port 8082 --reload
    ports:
      - "8082:8082"
    tty: true
    stdin_open: true

  shelf_tests:
    build:
      context: .
      target: tests

    environment:
      <<:
        - *global_envs
        - *postgres-cred
      TEST_POSTGRES_URL: postgresql://${PROJECT_NAME}_user:${PROJECT_NAME}@postgresql:5432/${PROJECT_NAME}_db

    depends_on:
      postgresql:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - .:/app

volumes:
  postgres-data:

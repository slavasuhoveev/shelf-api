version: '3.8'

x-postgres-cred: &postgres-cred
  POSTGRES_USER: ${PROJECT_NAME}_user
  POSTGRES_PASSWORD: ${PROJECT_NAME}
  POSTGRES_DB: ${PROJECT_NAME}_db

services:
  postgresql:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_db
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    environment:
      <<: *postgres-cred
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROJECT_NAME}_user -d ${PROJECT_NAME}_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  api:
    build:
      context: .
    image: ${PROJECT_NAME}:develop
    container_name: ${PROJECT_NAME}_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      <<: *postgres-cred
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      PYTHONPATH: /app/src
      AUTH_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
      JWT_ISSUER: ${PROJECT_NAME}-auth
      JWT_AUDIENCE: ${PROJECT_NAME}-api
      JWKS_CACHE_TTL_SECONDS: 300
    volumes:
      - ./src:/app/src:delegated
      - ./alembic:/app/alembic:delegated
      - ./alembic.ini:/app/alembic.ini:delegated
    command: uvicorn shelf.app.main:app --host 0.0.0.0 --port 8082 --reload
    ports:
      - "8082:8082"
    tty: true
    stdin_open: true

volumes:
  postgres-data:
